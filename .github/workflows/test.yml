name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor and the newest release.
        python: ["3.11", "3.15"]
    env:
      # Fail rather than re-resolve if uv.lock is out of date with pyproject.toml,
      # so CI runs exactly the tool versions that were tested locally.
      UV_LOCKED: "1"
      # The Python every uv command in this job uses.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install "$UV_PYTHON"

      - name: Install the locked dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      # The network/browser tests hit live services and drive a headless
      # browser, so they are too flaky for a PR gate; run the deterministic
      # subset here. Run the full suite locally with `uv run pytest`.
      - name: Run tests
        run: uv run pytest -m "not network and not browser"
