[project]
name = "doi-pdf"
version = "0.1.0"
description = "Given a DOI, find an open access PDF and its CrossRef or DataCite metadata."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ed Summers", email = "ehs@pobox.com" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
doi-pdf = "doi_pdf.cli:main"

[project.urls]
Homepage = "https://github.com/sul-dlss-labs/doi-pdf"
Repository = "https://github.com/sul-dlss-labs/doi-pdf"
Issues = "https://github.com/sul-dlss-labs/doi-pdf/issues"

[project.optional-dependencies]
# Browser-grade TLS fingerprinting for the pre-browser download tier; lets the
# plain HTTP client clear lighter Cloudflare / AWS WAF checks (see core._http_get).
stealth = [
    "curl_cffi>=0.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
    "ty>=0.0.55",
    "curl_cffi>=0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doi_pdf"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test makes live network calls (deselect with -m 'not network')",
    "browser: test renders a page with a headless browser (slow; needs `playwright install`)",
]
